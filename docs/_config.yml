title: Space Haven Mod Loader
description: A modding tool for Space Haven by Bugbyte
baseurl: "/spacehaven-modloader"
url: "https://ap0ught.github.io"

theme: just-the-docs

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: order

# Footer
footer_content: 'Space Haven Mod Loader is an open-source project. <a href="https://github.com/ap0ught/spacehaven-modloader">View on GitHub</a>.'

# Favicon
favicon_ico: "/assets/images/favicon.ico"

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/ap0ught/spacehaven-modloader"
  "Releases":
    - "https://github.com/ap0ught/spacehaven-modloader/releases"

aux_links_new_tab: true

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Collections (if needed)
# collections: {}

# Markdown
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
